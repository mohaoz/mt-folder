name: release

# 站点由 Cloudflare Pages 构建（sh build.sh → site/）；这里只负责
# 质量门禁后的滚动 Release：四个打印 PDF + 离线 HTML。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: python -m pip install .
      - run: mtf render --output-dir site
      - run: MTF_PREVIEW_DIR="$PWD/site" python -m unittest tests.test_output_gates -v
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: >
            自动构建于 ${{ github.sha }}。
            四个打印版式的 PDF 与离线单文件 HTML。
          make_latest: true
          files: |
            site/mtf.pdf
            site/mtf-bw.pdf
            site/mtf-landscape.pdf
            site/mtf-landscape-bw.pdf
            site/index.html
