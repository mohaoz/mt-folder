name: verify

# 官方数据全量验证：每周一次 + 手动触发。
# 数据缓存约 1 GiB，命中时全量验证约 5 分钟。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"  # 每周六 05:00 (UTC+8)

jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - uses: actions/cache@v4
        with:
          path: .mtf/library-checker-problems
          key: library-checker-${{ hashFiles('verify/catalog.json') }}
          restore-keys: library-checker-
      - run: python -m pip install .
      - run: mtf verify --ui plain --output-dir yosupo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-manifest
          path: |
            yosupo/README.md
            yosupo/.verify/logs/**/failure/**
          if-no-files-found: ignore
