name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      # 质量门禁依赖：poppler 检查 PDF，Noto CJK 保证中文字体可嵌入
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: python -m pip install .
      - run: python -m compileall -q mtf tests
      # 先渲染，产物质量门禁（tests/test_output_gates.py）随单元测试一起跑
      - run: mtf render --output-dir preview
      - run: python -m unittest discover -s tests -v
      - run: mtf verify --syntax-only --ui plain --output-dir yosupo
      - run: test -s yosupo/unionfind.cpp
      - run: test -s yosupo/shortest_path.cpp
