[package]
name = "mtf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typst-backed algorithm template and contest workspace tool"
homepage = "https://mt-folder.mohao.me"
repository = "https://github.com/mohaoz/mt-folder"
build = "build.rs"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "app/**",
    "book.typ",
    "template.typ",
    "src/**/*.typ",
    "/README.md",
]

[[bin]]
name = "mtf"
path = "app/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
